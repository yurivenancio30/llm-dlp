# How the binaries of a version are built (GoReleaser). GitHub runs it, in
# .github/workflows/release.yml, on the tag vX.Y.Z; "make dist" does the same on your machine,
# without publishing. See docs/versioning.md (in Portuguese: docs/pt-BR/versioning.md).
version: 2

project_name: llm-dlp

builds:
  - id: llm-dlp
    main: ./cmd/llm-dlp
    binary: llm-dlp
    # CGO_ENABLED=0: static binary, runs on any Linux (glibc or musl/Alpine)
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # the commit goes inside the binary ("llm-dlp version"); the version is the one in internal/version/version.go
    ldflags:
      - -s -w -X github.com/yurivenancio30/llm-dlp/internal/version.Commit={{ .ShortCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: llm-dlp
    formats:
      - tar.gz
    # llm-dlp_0.2.1_linux_amd64.tar.gz (install.sh builds this name)
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - docs/pt-BR/README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Version }}-next"

# The release notes are the version's section of CHANGELOG.md, which the workflow passes with
# --release-notes (scripts/release-notes.sh). GoReleaser's "changelog" step is what reads that
# file: with "disable: true" it is skipped and the release goes out with empty notes (it happened
# in 0.2.1 and 0.3.0). Without --release-notes, it would list the commits.
changelog:
  use: git

release:
  name_template: "llm-dlp {{ .Version }}"
