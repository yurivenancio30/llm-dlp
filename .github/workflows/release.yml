name: release

# On the tag vX.Y.Z (created by "make release"): tests, and GoReleaser (.goreleaser.yaml)
# builds the archives and publishes the release with the notes of section X.Y.Z of CHANGELOG.md.
# See docs/versioning.md (in Portuguese: docs/pt-BR/versioning.md).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: the tag is the code version
        run: |
          V="${GITHUB_REF_NAME#v}"
          test "$V" = "$(make -s version | cut -d' ' -f1)" || { echo "tag $GITHUB_REF_NAME does not match internal/version/version.go"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: tests
        run: make test
      - name: release notes
        run: ./scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
      - name: archives and publication
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # 0.2.1 and 0.3.0 went out with empty notes without anyone noticing: a release without notes fails here
      - name: the release has the notes
        run: |
          test -n "$(gh release view "v$VERSION" --json body -q .body)" && exit 0
          echo "release v$VERSION went out without notes; writing the ones from the CHANGELOG"
          gh release edit "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
