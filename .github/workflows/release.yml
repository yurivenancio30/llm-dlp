name: release

# Ao receber a tag vX.Y.Z (criada por "make release"): testa e o GoReleaser (.goreleaser.yaml)
# monta os pacotes e publica a release com as notas da seção X.Y.Z do CHANGELOG.md.
# Ver docs/versioning.md (em português: docs/pt-BR/versoes.md).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: a tag é a versão do código
        run: |
          V="${GITHUB_REF_NAME#v}"
          test "$V" = "$(make -s versao | cut -d' ' -f1)" || { echo "a tag $GITHUB_REF_NAME não bate com internal/versao/versao.go"; exit 1; }
          echo "VERSAO=$V" >> "$GITHUB_ENV"
      - name: testes
        run: make test
      - name: notas da versão
        run: ./scripts/notas-da-versao.sh "$VERSAO" > "$RUNNER_TEMP/notas.md"
      - name: pacotes e publicação
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notas.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
